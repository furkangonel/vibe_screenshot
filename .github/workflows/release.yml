name: Release
on:
  push:
    tags: ['v20*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-verification-failure
          path: test-results/
  package:
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Test packaged desktop and MCP
        run: node scripts/test-packaged.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run source:pack
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: node scripts/release-checksums.mjs
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.slice(1);
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const section = changelog.split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
            if (!section) throw new Error('Missing changelog section.');
            const { owner, repo } = context.repo;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data; }
            catch(e) { if(e.status !== 404) throw e; release = (await github.rest.repos.createRelease({owner,repo,tag_name:tag,name:`Vibe Screenshots ${version}`,body:section,draft:true,prerelease:false})).data; }
            for (const name of fs.readdirSync('release').filter(n => /\.(dmg|zip|exe|AppImage)$/.test(n) || n === 'SHA256SUMS.txt')) {
              const existing = release.assets.find(a => a.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner,repo,asset_id:existing.id});
              const data = fs.readFileSync(path.join('release',name));
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false,make_latest:'true'});
